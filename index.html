<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пульсирующий круг</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      overflow: hidden;
    }

    .circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb 60%, #1e3a8a);
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.6),
                  0 0 80px rgba(59, 130, 246, 0.3);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.6),
                    0 0 80px rgba(59, 130, 246, 0.3);
      }
      50% {
        transform: scale(1.3);
        box-shadow: 0 0 60px rgba(59, 130, 246, 0.8),
                    0 0 120px rgba(59, 130, 246, 0.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .circle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="circle"></div>
</body>
</html>
